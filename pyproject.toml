[project]
name = "forgelens"
version = "0.1.0"
description = "Explainable forgery detector for UPI payment screenshots. Raises suspicion; never confirms a payment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "pyyaml>=6.0",
]

[project.scripts]
forgelens-redact = "forgelens.redact:main"
forgelens-env = "forgelens.device:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
